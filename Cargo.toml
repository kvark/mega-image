[package]
name = "mega-image"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[dependencies]
meganeura = { git = "https://github.com/kvark/meganeura", rev = "cf85bf44babfc87e249713265f4c0931a605c577", features = ["gguf"] }
hf-hub = { version = "1", features = ["blocking", "rustls-tls"] }
tokenizers = { version = "0.22.1", default-features = false, features = ["fancy-regex"] }

[profile.release]
lto = "thin"
